version: 2
updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    groups:
      microsoft:
        patterns: ['Microsoft.*', 'System.*']
      serilog:
        patterns: ['Serilog*']
      testing:
        patterns: ['xunit*']

  - package-ecosystem: npm
    directory: /src/Pulsar.Web
    schedule:
      interval: weekly
    groups:
      lint-and-format:
        patterns: ['eslint*', '@eslint/*', 'typescript-eslint', 'prettier', 'globals']
      testing:
        patterns: ['vitest', 'jsdom', '@testing-library/*', '@playwright/test']
      build:
        patterns: ['vite', '@vitejs/*', 'tailwindcss', '@tailwindcss/*', 'typescript']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
