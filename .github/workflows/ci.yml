name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  dotnet:
    name: .NET (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore Pulsar.slnx --locked-mode

      - name: Check formatting
        run: dotnet format Pulsar.slnx --verify-no-changes --no-restore

      - name: Build
        run: dotnet build Pulsar.slnx -c Release --no-restore

      # The runner images ship PostgreSQL with its service stopped (Ubuntu: 16, Windows: 17).
      - name: Start PostgreSQL (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo systemctl start postgresql.service
          sudo -u postgres psql -v ON_ERROR_STOP=1 -c "CREATE ROLE pulsar_ci LOGIN CREATEDB PASSWORD 'pulsar_ci';"

      - name: Start PostgreSQL (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $service = Get-Service -Name 'postgresql*' | Select-Object -First 1
          Set-Service -Name $service.Name -StartupType Manual
          Start-Service -Name $service.Name
          & "$env:PGBIN\psql.exe" -v ON_ERROR_STOP=1 -c "CREATE ROLE pulsar_ci LOGIN CREATEDB PASSWORD 'pulsar_ci';"

      # An S3-compatible server for the remote backup tests (SeaweedFS, Apache-2.0), with test-only credentials.
      - name: Start S3 storage (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          mkdir -p "$RUNNER_TEMP/s3"
          cat > "$RUNNER_TEMP/s3/s3.json" <<'JSON'
          {"identities":[{"name":"pulsar-ci","credentials":[{"accessKey":"pulsar-ci-access","secretKey":"pulsar-ci-secret-not-a-real-one"}],"actions":["Admin","Read","Write","List","Tagging"]}]}
          JSON
          docker run -d --name seaweedfs -p 8333:8333 -v "$RUNNER_TEMP/s3:/config:ro" chrislusf/seaweedfs:4.48 \
            server -s3 -s3.port=8333 -s3.config=/config/s3.json -volume.max=100 -master.volumeSizeLimitMB=64
          for i in $(seq 1 60); do
            [ "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8333/)" != "000" ] && break
            sleep 1
          done
          echo "PULSAR_TEST_S3=http://127.0.0.1:8333;pulsar-ci-access;pulsar-ci-secret-not-a-real-one" >> "$GITHUB_ENV"

      # MariaDB for the game database tests, which create databases and users: only in this throwaway container, on
      # 127.0.0.1:3307 as in CONTRIBUTING.md (the host's network, so the users the tests make for 127.0.0.1 match). It
      # makes its own TLS certificate, which the tests that require TLS need. The Linux leg requires the tests
      # (PULSAR_REQUIRE_MYSQL): a server that did not start fails them instead of skipping them.
      - name: Start MariaDB (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          docker run -d --name mariadb --network host -e MARIADB_ROOT_PASSWORD=pulsar-ci-mariadb mariadb:11.8 --port=3307
          for i in $(seq 1 90); do
            docker exec mariadb healthcheck.sh --connect --innodb_initialized && break
            sleep 1
          done
          docker exec mariadb healthcheck.sh --connect --innodb_initialized
          echo "PULSAR_TEST_MYSQL=Server=127.0.0.1;Port=3307;User ID=root;Password=pulsar-ci-mariadb" >> "$GITHUB_ENV"

      - name: Test
        run: dotnet test --solution Pulsar.slnx -c Release --no-build
        env:
          PULSAR_TEST_POSTGRES: Host=localhost;Port=5432;Username=pulsar_ci;Password=pulsar_ci
          PULSAR_REQUIRE_DATABASE: 'true'
          PULSAR_REQUIRE_MYSQL: ${{ runner.os == 'Linux' && 'true' || 'false' }}
          # Downloads SteamCMD from Valve and checks its signature (Windows only).
          PULSAR_NETWORK_TESTS: '1'

      # The install, update and backup scripts' own checks, in Windows PowerShell 5.1 as the setups run them. The runner
      # is elevated and thrown away after the job, so the checks that need elevation run too (-RequireElevation fails
      # the step instead of skipping them); they change nothing but folders of their own under -Scratch. That is in
      # ProgramData: the scripts trust a folder only when no other account could replace a folder above it, which the
      # runner's temp folders fail (D:\ belongs to NETWORK SERVICE, the profile to the runner's account).
      - name: Test the install scripts (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $scratch = New-Item -ItemType Directory -Force (Join-Path $env:ProgramData 'PulsarScriptTests')
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts/tests/Test-InstallScripts.ps1 -Scratch $scratch.FullName -RequireElevation
          if ($LASTEXITCODE -ne 0) { throw "Test-InstallScripts.ps1 failed (exit code $LASTEXITCODE)." }

      # Local accounts, user rights and servers started as their own account: CreateProcessAsUser needs SYSTEM, as
      # the agent service runs. Only here, on the disposable runner (the tests skip themselves anywhere else).
      - name: Test server isolation as SYSTEM (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./scripts/ci/Invoke-AsSystem.ps1 -FilePath tests/Pulsar.Agent.Windows.Tests/bin/Release/net10.0-windows/Pulsar.Agent.Windows.Tests.exe `
            -Environment @{ PULSAR_ACCOUNT_TESTS = '1'; DOTNET_ROOT = $env:DOTNET_ROOT }

  web:
    name: Web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/Pulsar.Web
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/Pulsar.Web/package-lock.json

      - run: npm ci

      # The API tests check openapi.json against the API; this checks the TypeScript types against openapi.json.
      - name: Check generated API client
        run: |
          npm run api:generate
          git diff --exit-code -- src/api

      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  # The production install on a clean, disposable Windows: elevated enroll, machine key (in the TPM when the runner
  # has a ready one), PulsarAgent service as SYSTEM, key rotation, a test game server running as its own Windows
  # account, a real Counter-Strike: Source server installed by SteamCMD from Valve (about 2.5 GB) and run over RCON
  # with managed firewall rules, revocation, unenroll. Same script as the Windows Sandbox check
  # (scripts/sandbox/agent-install); the runner is elevated and discarded after the job.
  agent-install:
    name: Agent install (windows-latest)
    runs-on: windows-latest
    needs: [dotnet]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Publish panel and agent
        shell: pwsh
        run: |
          # Self-contained: the service runs as SYSTEM, which does not see the job's DOTNET_ROOT.
          dotnet publish src/Pulsar.Api -c Release -r win-x64 --self-contained -o artifacts/agent-install-ci/panel
          dotnet publish src/Pulsar.Agent -c Release -r win-x64 --self-contained -o artifacts/agent-install-ci/agent
          # The agent MSI, as scripts/sandbox/agent-install/prepare.ps1 builds it: 1.0.0, a second build of 1.0.0, and 1.0.1.
          foreach ($build in @(@('1.0.0', 'msi'), @('1.0.0', 'msi/rebuild'), @('1.0.1', 'msi'))) {
            powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts/release/Build-AgentMsi.ps1 -AgentDir artifacts/agent-install-ci/agent -Version $build[0] -Output "artifacts/agent-install-ci/$($build[1])"
            if ($LASTEXITCODE -ne 0) { throw 'agent MSI failed' }
          }
          dotnet publish tests/Pulsar.TestGameServer -c Release -r win-x64 --self-contained -o artifacts/agent-install-ci/testgame
          # The check makes sure the ZIP's installer leaves an agent from the MSI alone (as prepare.ps1 bundles it).
          Copy-Item scripts/install/Install-Pulsar.ps1 artifacts/agent-install-ci/

      - name: Install, rotate, run servers, revoke and remove the agent
        shell: powershell
        run: .\scripts\sandbox\agent-install\run.ps1 -Bundle "$PWD\artifacts\agent-install-ci" -PgBin $env:PGBIN

      - name: Report
        if: always()
        shell: pwsh
        run: |
          Get-Content artifacts/agent-install-ci/report/summary.txt -ErrorAction SilentlyContinue
          Get-Content artifacts/agent-install-ci/report/summary.txt -ErrorAction SilentlyContinue | Out-File -Append $env:GITHUB_STEP_SUMMARY

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: agent-install-report
          path: artifacts/agent-install-ci/report
          retention-days: 7

  # The release ZIP installed with Install-Pulsar.ps1 as docs/guides/install.md describes (panel and agent on one
  # machine, database created in the machine's PostgreSQL service), then backed up with Backup-Pulsar.ps1, lost,
  # restored on the same machine, updated and removed. Windows Server 2022; the same script runs in Windows Sandbox
  # (scripts/sandbox/install) for Windows 11.
  install:
    name: Install from the release ZIP (windows-2022)
    runs-on: windows-2022
    needs: [dotnet, web]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/Pulsar.Web/package-lock.json

      - name: Build and extract the release ZIP
        shell: pwsh
        run: |
          ./scripts/release/Build-Release.ps1 -Version 0.0.0-ci -Output artifacts/install-ci/zip
          Expand-Archive artifacts/install-ci/zip/pulsar-0.0.0-ci-windows-x64.zip artifacts/install-ci/release

      # As the install guide's step 1: PostgreSQL's own installer (through Chocolatey). The runner's PostgreSQL 14 stays
      # installed (and too old for Pulsar), so the installer must pick the newest one.
      - name: Install PostgreSQL 17
        shell: pwsh
        run: choco install postgresql17 --params "/Password:pulsar-ci-superuser" -y --no-progress

      - name: Install, back up, restore, update and remove
        shell: powershell
        run: .\scripts\sandbox\install\run.ps1 -Bundle "$PWD\artifacts\install-ci" -PostgresPassword pulsar-ci-superuser

      - name: Report
        if: always()
        shell: pwsh
        run: |
          Get-Content artifacts/install-ci/report/summary.txt -ErrorAction SilentlyContinue
          Get-Content artifacts/install-ci/report/summary.txt -ErrorAction SilentlyContinue | Out-File -Append $env:GITHUB_STEP_SUMMARY

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: install-report
          path: artifacts/install-ci/report
          retention-days: 7

  e2e:
    name: End-to-end (${{ matrix.os }})
    needs: [dotnet, web]
    # Windows also runs the real agent (e2e/agent.spec.ts); that spec is skipped elsewhere.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: src/Pulsar.Web
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/Pulsar.Web/package-lock.json

      - name: Start PostgreSQL (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo systemctl start postgresql.service
          sudo -u postgres psql -v ON_ERROR_STOP=1 -c "CREATE ROLE pulsar_ci LOGIN PASSWORD 'pulsar_ci';" -c "CREATE DATABASE pulsar_e2e OWNER pulsar_ci;"

      - name: Start PostgreSQL (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $service = Get-Service -Name 'postgresql*' | Select-Object -First 1
          Set-Service -Name $service.Name -StartupType Manual
          Start-Service -Name $service.Name
          & "$env:PGBIN\psql.exe" -v ON_ERROR_STOP=1 -c "CREATE ROLE pulsar_ci LOGIN PASSWORD 'pulsar_ci';" -c "CREATE DATABASE pulsar_e2e OWNER pulsar_ci;"

      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run e2e
        env:
          PULSAR_E2E_POSTGRES: Host=localhost;Port=5432;Database=pulsar_e2e;Username=pulsar_ci;Password=pulsar_ci

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report-${{ matrix.os }}
          path: |
            src/Pulsar.Web/playwright-report
            src/Pulsar.Web/test-results
          retention-days: 7
