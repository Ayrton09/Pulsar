name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  dotnet:
    name: .NET (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore Pulsar.slnx --locked-mode

      - name: Check formatting
        run: dotnet format Pulsar.slnx --verify-no-changes --no-restore

      - name: Build
        run: dotnet build Pulsar.slnx -c Release --no-restore

      - name: Test
        run: dotnet test --solution Pulsar.slnx -c Release --no-build

  web:
    name: Web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/Pulsar.Web
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/Pulsar.Web/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  e2e:
    name: End-to-end
    runs-on: ubuntu-latest
    needs: [dotnet, web]
    defaults:
      run:
        working-directory: src/Pulsar.Web
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/Pulsar.Web/package-lock.json

      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run e2e

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: |
            src/Pulsar.Web/playwright-report
            src/Pulsar.Web/test-results
          retention-days: 7
