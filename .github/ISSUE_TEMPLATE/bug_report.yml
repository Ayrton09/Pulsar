name: Bug report
description: Something in Pulsar is not working as expected.
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        **Security problems must not be reported here.** See SECURITY.md for private reporting.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - Panel (backend)
        - Panel (web UI)
        - Agent
        - Game manifest
        - Documentation
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Pulsar version or commit
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: Windows Server 2022 21H2, Windows 11 24H2…
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Remove passwords, tokens and other secrets before pasting.
      render: text
